plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def hasGoogleServices = file("google-services.json").exists()
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle("google-services.json not found — FCM disabled until Firebase config is added")
}

import java.util.Properties
import java.io.FileInputStream

def readVersionName() {
    def f = new File(rootDir, "version.txt")
    return f.exists() ? f.getText("UTF-8").trim() : "1.0"
}

def computeVersionCode(String ver) {
    def parts = ver.split('\\.')
    def major = parts.length > 0 ? parts[0].toInteger() : 0
    def minor = parts.length > 1 ? parts[1].toInteger() : 0
    def patch = parts.length > 2 ? parts[2].toInteger() : 0
    // versionCode = MMmmpp (e.g., 1.0.4 -> 10004)
    // بستهٔ ۱.۰.۱۴۷۲ با کد ۱۱۴۷۲ روی گوشی نصب شده است. نام نسخه نباید از ۱.۰.۱۴۷۳ پایین‌تر برود.
    // پلی و بازار همین عدد را از version.txt می‌گیرند و به شمارهٔ اجرای CI وابسته نیستند.
    return major * 10000 + minor * 100 + patch
}

// Prefer key.properties (runtime in CI); fallback to envs if needed
def loadKeystoreProps() {
    def props = new Properties()
    def keyPropsFile = new File(rootDir, "key.properties")
    if (keyPropsFile.exists()) {
        new FileInputStream(keyPropsFile).withCloseable { props.load(it) }
        return props
    }
    // fallback to environment variables
    System.getenv().each { k, v -> props.setProperty(k, v) }
    return props
}
def ksProps = loadKeystoreProps()
// Resolve keystore path: support relative (to rootDir) and absolute
def releaseStorePathProp = ksProps.getProperty("storeFile", "app/keystore/vinor-release.jks")
def releaseStoreFile = new File(releaseStorePathProp)
if (!releaseStoreFile.isAbsolute()) {
    releaseStoreFile = new File(rootDir, releaseStorePathProp)
}
def trimOrNull = { s -> s == null ? null : s.toString().trim() }
def releaseStorePassword = trimOrNull(ksProps.getProperty("storePassword") ?: ksProps.getProperty("RELEASE_STORE_PASSWORD"))
def releaseKeyAlias = trimOrNull(ksProps.getProperty("keyAlias", "vinor_release")) ?: "vinor_release"
def releaseKeyPassword = trimOrNull(ksProps.getProperty("keyPassword") ?: ksProps.getProperty("RELEASE_KEY_PASSWORD"))

// برای نصب دستی روی گوشی فقط APK خروجی assembleRelease را کپی کنید.
// فایل .aab (bundleRelease) برای پلی‌استور است؛ باز کردن آن روی گوشی معمولاً خطای «تجزیه بسته» می‌دهد.
def storeVersionCode = computeVersionCode(readVersionName())
def ciRunStr = System.getenv("GITHUB_RUN_NUMBER")
def ciCode = (ciRunStr != null && ciRunStr.isInteger()) ? ciRunStr.toInteger() : null
def sideloadVersionCode = ciCode != null ? Math.max(storeVersionCode, ciCode) : storeVersionCode

android {
    namespace "ir.vinor.app"
    compileSdk 36

    defaultConfig {
        applicationId "ir.vinor.app"
        minSdk 21
        targetSdk 36
        versionName readVersionName()
        versionCode storeVersionCode
        // APK انتشار: فقط ABIهای رایج موبایل (کاهش حجم؛ x86 فقط در debug emulator)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        vinor {
            storeFile releaseStoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword (releaseKeyPassword ?: releaseStorePassword)
            storeType "JKS"
        }
    }

    flavorDimensions "channel"
    productFlavors {
        // نصب مستقیم از vinor.ir. به‌روزرسانی با دانلود APK همان کلید امضا.
        sideload {
            dimension "channel"
            getIsDefault().set(true)
            versionCode sideloadVersionCode
            buildConfigField "String", "STORE", "\"sideload\""
        }
        // گوگل‌پلی: AAB با همین کلید به‌عنوان upload key. به‌روزرسانی از Play.
        play {
            dimension "channel"
            versionCode storeVersionCode
            buildConfigField "String", "STORE", "\"play\""
        }
        // کافه‌بازار: APK امضاشده. به‌روزرسانی از خود بازار.
        bazaar {
            dimension "channel"
            versionCode storeVersionCode
            buildConfigField "String", "STORE", "\"bazaar\""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.vinor
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        direct {
            initWith release
            signingConfig signingConfigs.vinor
            debuggable false
        }
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            // شبیه‌ساز x86_64 برای اسکرین‌شات فروشگاه. انتشار فقط ARM می‌ماند.
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
        }
    }

    packaging {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/*.kotlin_module",
            ]
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.webkit:webkit:1.11.0" // Chrome-like features & compat APIs
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.android.gms:play-services-auth-api-phone:18.0.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:okhttp-brotli:4.12.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    
    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:2.8.2"
    implementation "androidx.navigation:navigation-ui-ktx:2.8.2"
    
    // Material Design for Bottom Navigation
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-process:2.8.6"

    // فقط بیلد پلی. بازار و نصب مستقیم این کتابخانه را ندارند.
    playImplementation "com.google.android.play:app-update:2.1.0"

    // Firebase Cloud Messaging (push when app closed)
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging-ktx"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

// Lazy validation: only when building direct/release
tasks.register("checkDirectConstraints") {
    group = "verification"
    doLast {
        if (android.defaultConfig.applicationId != "ir.vinor.app") {
            throw new GradleException("applicationId must be 'ir.vinor.app'")
        }
        def sc = android.signingConfigs.findByName("vinor")
        if (sc == null) throw new GradleException("signingConfigs.vinor missing")
        if (sc.storeFile == null || !sc.storeFile.exists()) throw new GradleException("Keystore missing at ${sc.storeFile}")
        if (!releaseStorePassword) throw new GradleException("storePassword missing")
        if (!releaseKeyPassword) throw new GradleException("keyPassword missing")
        if (!releaseKeyAlias) throw new GradleException("keyAlias missing")
    }
}

// Android App Links: regenerate assetlinks.json from release keystore (or signed APK fallback)
tasks.register("generateAssetLinks", Exec) {
    group = "publishing"
    description = "Generate Digital Asset Links JSON from release signing cert"
    workingDir rootDir
    def py = new File(rootDir, "scripts/generate_assetlinks.py")
    onlyIf { py.exists() }
    // Prefer python3 (Linux CI), then python (Windows)
    def pythonCmd = System.getenv("PYTHON") ?: (
        org.gradle.internal.os.OperatingSystem.current().isWindows() ? "python" : "python3"
    )
    commandLine pythonCmd, py.absolutePath
}

tasks.matching {
    it.name ==~ /^pre[A-Za-z0-9]*(Release|Direct)Build$/
}.configureEach {
    dependsOn("checkDirectConstraints")
    dependsOn("generateAssetLinks")
}

// Also refresh assetlinks before assembling release artifacts
tasks.matching {
    it.name ==~ /^(assemble|bundle)[A-Za-z0-9]*(Release|Direct)$/
}.configureEach {
    dependsOn("generateAssetLinks")
}

