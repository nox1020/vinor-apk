name: Auto PR merge

# paths-ignore در auto-pr-merge.yml آماده شدن پیش‌نویس را برای فایل‌های کد حذف می‌کند.
# اینجا همان تصمیم، بدون ساخت دوباره، فقط برای همان فایل‌ها اجرا می‌شود.

on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'version.txt'

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: auto-pr-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    name: Decide merge
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted script on main, or this pull request in-repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Classifier self-test
        run: bash .github/workflows/auto-pr-merge.sh --self-test

      - name: Resolve, or report why merge stopped
        env:
          REPO_KIND: apk
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VINOR_AUTOMERGE_TOKEN: ${{ secrets.VINOR_AUTOMERGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/auto-pr-merge.sh
