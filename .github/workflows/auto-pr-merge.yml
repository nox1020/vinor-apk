name: Auto PR merge

# مرج فقط وقتی بررسی‌های الزامی موفق باشند.
# تست، Branch Protection و مجوزها را تغییر نمی‌دهد.
# با GITHUB_TOKEN مرج یا push نمی‌کند؛ آن توکن CI روی main را خاموش می‌کند.
# push و مرج فقط با سکرت VINOR_AUTOMERGE_TOKEN انجام می‌شود.

# هر پوش کد فقط Android CI را شروع می‌کند.
# این تصمیم بعد از موفقیت همان ساخت، یک بار، و فقط برای Pull Request اجرا می‌شود.
# شکست ساخت، پوش main، و فورک رانر نمی‌گیرند.
# اگر فایل کد عوض نشده (قانون یا ورک‌فلو)، همین جا یک بار تصمیم گرفته می‌شود.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'version.txt'
  workflow_run:
    workflows: ["Android CI & Direct APK"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: auto-pr-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  decide:
    name: Decide merge
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted script on main, or this pull request in-repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.sha || github.event.pull_request.head.sha }}

      - name: Classifier self-test
        run: bash .github/workflows/auto-pr-merge.sh --self-test

      - name: Resolve, or report why merge stopped
        env:
          REPO_KIND: apk
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VINOR_AUTOMERGE_TOKEN: ${{ secrets.VINOR_AUTOMERGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/auto-pr-merge.sh
