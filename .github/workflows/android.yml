name: Android CI & Direct APK

# تغییر version.txt یا همین فایل، ساخت امضاشده را در Pull Request هم اجرا می‌کند.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'version.txt'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'version.txt'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            release:
              - 'version.txt'
              - '.github/workflows/android.yml'
            app:
              - 'app/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'

  unit-test:
    name: Unit tests
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testSideloadDebugUnitTest :app:testPlayDebugUnitTest :app:testBazaarDebugUnitTest

  debug:
    name: Build Debug APK
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon --stacktrace :app:assembleSideloadDebug

      - name: Upload APK
        # فقط وقتی APK امضاشده ساخته نمی‌شود؛ وگرنه کاربر اشتباهاً debug را نصب می‌کند و «App not installed» می‌گیرد.
        if: needs.changes.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vinor-debug-unsigned
          path: app/build/outputs/apk/sideload/debug/*.apk
          retention-days: 7

      - name: Debug APK is not for phones with a release install
        if: needs.changes.outputs.release == 'true'
        run: |
          {
            echo "## Debug artifact"
            echo "روی این PR آرتیفکت debug آپلود نشد. برای گوشی فقط **vinor-direct-apk** را بگیرید."
            echo "\`vinor-debug-unsigned\` امضای debug دارد و روی نصب release معمولاً **App not installed** می‌دهد."
          } >> "$GITHUB_STEP_SUMMARY"

  direct:
    name: Build Release APK (signed)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.release == 'true' ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Require signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && { echo "ANDROID_KEYSTORE_BASE64 is empty."; missing=1; }
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && { echo "ANDROID_KEYSTORE_PASSWORD is empty."; missing=1; }
          [ -z "${ANDROID_KEY_ALIAS:-}" ] && { echo "ANDROID_KEY_ALIAS is empty."; missing=1; }
          [ -z "${ANDROID_KEY_PASSWORD:-}" ] && { echo "ANDROID_KEY_PASSWORD is empty."; missing=1; }
          if [ "$missing" = "1" ]; then
            echo "Release signing secrets are required. Refusing to generate an ephemeral keystore."
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_BASE64=$ANDROID_KEYSTORE_BASE64"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Prepare keystore directory
        run: mkdir -p app/keystore

      - name: Decode keystore from secret
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore/vinor-release.jks
          if [ ! -s app/keystore/vinor-release.jks ]; then
            echo "Decoded keystore is empty or missing."
            exit 1
          fi

      - name: Verify keystore readability
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -keystore app/keystore/vinor-release.jks -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Detect keystore alias (auto-fix)
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          ALIAS="$(keytool -list -v -storetype JKS -keystore app/keystore/vinor-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'Alias name:' | cut -d':' -f2 | sed 's/^[[:space:]]*//')"
          if [ -n "$ALIAS" ]; then
            echo "Detected keystore alias: $ALIAS"
            echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          else
            echo "WARN: Unable to detect alias; keep provided ANDROID_KEY_ALIAS"
          fi

      - name: Create runtime key.properties
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing secrets are not fully set."
            exit 1
          fi
          printf "%s\n" \
            "storeFile=app/keystore/vinor-release.jks" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
          > key.properties
          echo "Created key.properties for runtime."

      - name: SMS Retriever hash (for sms.ir OTP auto-fill)
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          CERT_DER="app/keystore/release-signing-cert.der"
          keytool -exportcert \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore app/keystore/vinor-release.jks \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file "$CERT_DER"
          HASH="$(python3 scripts/sms_retriever_hash.py "$CERT_DER")"
          echo "SMS_RETRIEVER_HASH=$HASH"
          {
            echo "## SMS Retriever hash (OTP auto-fill in APK)"
            echo ""
            echo "Copy this into \`api_keys.py\` on the server:"
            echo ""
            echo '```'
            echo "SMS_RETRIEVER_HASH = \"$HASH\""
            echo '```'
            echo ""
            echo "sms.ir OTP template:"
            echo '```'
            echo "کد تایید:"
            echo "<#> #CODE#"
            echo "@vinor.ir ##CODE#"
            echo "#HASH#"
            echo '```'
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Package | \`ir.vinor.app\` |"
            echo "| Keystore alias | \`$ANDROID_KEY_ALIAS\` |"
            echo "| Hash (11 chars) | \`$HASH\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$CERT_DER"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build sideload APK, Bazaar APK, and Play AAB
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleSideloadRelease :app:assembleBazaarRelease :app:bundlePlayRelease --stacktrace --no-daemon

      - name: Verify signed APK version and derive artifact name
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(head -n1 version.txt | tr -d '\r' | xargs)"
          if [[ ! "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version.txt must be major.minor.patch"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION="$MAJOR.$MINOR.$((PATCH + GITHUB_RUN_NUMBER))"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH + GITHUB_RUN_NUMBER))
          APK="$(find app/build/outputs/apk/sideload/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [ ! -s "$APK" ]; then
            echo "Signed sideload APK not found"
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          if [ -z "$AAPT" ]; then
            echo "Android aapt not found"
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK")"
          BADGING="$(printf '%s' "$BADGING" | sed -n '1p')"
          echo "$BADGING"
          if [[ "$BADGING" != *"versionName='$VERSION'"* || "$BADGING" != *"versionCode='$VERSION_CODE'"* ]]; then
            echo "APK version does not match computed build version: $VERSION ($VERSION_CODE)"
            exit 1
          fi
          echo "STORE_VERSION=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "### Signed APK version: $VERSION (code $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK to include version
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/sideload/release"
          SRC_APK="$(ls -1 "$APK_DIR"/*.apk | head -n 1)"
          if [ -z "$SRC_APK" ]; then
            echo "No APK found in $APK_DIR"
            exit 1
          fi
          DEST_APK="$APK_DIR/vinor-${{ steps.version.outputs.VERSION }}.apk"
          mv "$SRC_APK" "$DEST_APK"
          echo "Renamed to: $DEST_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinor-direct-apk
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # فایل .aab با باز کردن در گوشی نصب نمی‌شود و خطای «مشکلی در تجزیه بسته» می‌دهد؛ فقط APK را برای سایدلود استفاده کنید.
      - name: Sideload hint (APK vs AAB)
        run: |
          {
            echo "## Android sideload — APK vs AAB"
            echo ""
            echo "| Artifact | Install by opening on phone? |"
            echo "|----------|--------------------------------|"
            echo "| **vinor-direct-apk** (\`.apk\`) | Yes — sideload from vinor.ir |"
            echo "| **vinor-bazaar-apk** (\`.apk\`) | Cafe Bazaar upload only |"
            echo "| **vinor-play-aab** (\`.aab\`) | **No** — Play Console only; opening it on a phone shows a parse error |"
            echo ""
            echo "### فارسی"
            echo "برای نصب دستی فقط **vinor-direct-apk** را بگیرید. **vinor-bazaar-apk** برای پنل کافه‌بازار است و **vinor-play-aab** فقط برای کنسول پلی."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename Bazaar APK
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/bazaar/release"
          SRC_APK="$(ls -1 "$APK_DIR"/*.apk | head -n 1)"
          if [ -z "$SRC_APK" ]; then
            echo "No Bazaar APK found in $APK_DIR"
            exit 1
          fi
          mv "$SRC_APK" "$APK_DIR/vinor-${{ steps.version.outputs.STORE_VERSION }}-bazaar.apk"

      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: vinor-bazaar-apk
          path: app/build/outputs/apk/bazaar/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Rename Play App Bundle
        shell: bash
        run: |
          AAB_DIR="app/build/outputs/bundle/playRelease"
          SRC_AAB="$(ls -1 "$AAB_DIR"/*.aab | head -n 1)"
          if [ -z "$SRC_AAB" ]; then
            echo "No Play AAB found in $AAB_DIR"
            exit 1
          fi
          mv "$SRC_AAB" "$AAB_DIR/vinor-${{ steps.version.outputs.STORE_VERSION }}-play.aab"

      - name: Upload Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: vinor-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 14
