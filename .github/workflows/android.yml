name: Android CI & Direct APK

# تغییر version.txt یا همین فایل، ساخت امضاشده را در Pull Request هم اجرا می‌کند.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'version.txt'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'version.txt'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            release:
              - 'version.txt'
              - '.github/workflows/android.yml'
            app:
              - 'app/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'

  unit-test:
    name: Unit tests
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

  debug:
    name: Build Debug APK
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        # فقط وقتی APK امضاشده ساخته نمی‌شود؛ وگرنه کاربر اشتباهاً debug را نصب می‌کند و «App not installed» می‌گیرد.
        if: needs.changes.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vinor-debug-unsigned
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Debug APK is not for phones with a release install
        if: needs.changes.outputs.release == 'true'
        run: |
          {
            echo "## Debug artifact"
            echo "روی این PR آرتیفکت debug آپلود نشد. برای گوشی فقط **vinor-direct-apk** را بگیرید."
            echo "\`vinor-debug-unsigned\` امضای debug دارد و روی نصب release معمولاً **App not installed** می‌دهد."
          } >> "$GITHUB_STEP_SUMMARY"

  direct:
    name: Build Release APK (signed)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.release == 'true' ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Require signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && { echo "ANDROID_KEYSTORE_BASE64 is empty."; missing=1; }
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && { echo "ANDROID_KEYSTORE_PASSWORD is empty."; missing=1; }
          [ -z "${ANDROID_KEY_ALIAS:-}" ] && { echo "ANDROID_KEY_ALIAS is empty."; missing=1; }
          [ -z "${ANDROID_KEY_PASSWORD:-}" ] && { echo "ANDROID_KEY_PASSWORD is empty."; missing=1; }
          if [ "$missing" = "1" ]; then
            echo "Release signing secrets are required. Refusing to generate an ephemeral keystore."
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_BASE64=$ANDROID_KEYSTORE_BASE64"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Prepare keystore directory
        run: mkdir -p app/keystore

      - name: Decode keystore from secret
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore/vinor-release.jks
          if [ ! -s app/keystore/vinor-release.jks ]; then
            echo "Decoded keystore is empty or missing."
            exit 1
          fi

      - name: Verify keystore readability
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -keystore app/keystore/vinor-release.jks -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Detect keystore alias (auto-fix)
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          ALIAS="$(keytool -list -v -storetype JKS -keystore app/keystore/vinor-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'Alias name:' | cut -d':' -f2 | sed 's/^[[:space:]]*//')"
          if [ -n "$ALIAS" ]; then
            echo "Detected keystore alias: $ALIAS"
            echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          else
            echo "WARN: Unable to detect alias; keep provided ANDROID_KEY_ALIAS"
          fi

      - name: Create runtime key.properties
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing secrets are not fully set."
            exit 1
          fi
          printf "%s\n" \
            "storeFile=app/keystore/vinor-release.jks" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
          > key.properties
          echo "Created key.properties for runtime."

      - name: SMS Retriever hash (for sms.ir OTP auto-fill)
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          CERT_DER="app/keystore/release-signing-cert.der"
          keytool -exportcert \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore app/keystore/vinor-release.jks \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file "$CERT_DER"
          HASH="$(python3 scripts/sms_retriever_hash.py "$CERT_DER")"
          echo "SMS_RETRIEVER_HASH=$HASH"
          {
            echo "## SMS Retriever hash (OTP auto-fill in APK)"
            echo ""
            echo "Copy this into \`api_keys.py\` on the server:"
            echo ""
            echo '```'
            echo "SMS_RETRIEVER_HASH = \"$HASH\""
            echo '```'
            echo ""
            echo "sms.ir OTP template:"
            echo '```'
            echo "کد تایید:"
            echo "<#> #CODE#"
            echo "@vinor.ir ##CODE#"
            echo "#HASH#"
            echo '```'
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Package | \`ir.vinor.app\` |"
            echo "| Keystore alias | \`$ANDROID_KEY_ALIAS\` |"
            echo "| Hash (11 chars) | \`$HASH\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$CERT_DER"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: (Optional) Build Release AAB
        continue-on-error: true
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Read version name
        id: version
        shell: bash
        run: |
          VERSION="$(head -n1 version.txt | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$VERSION" ]; then
            echo "version.txt is empty; cannot derive version."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK to include version
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/release"
          SRC_APK="$(ls -1 "$APK_DIR"/*.apk | head -n 1)"
          if [ -z "$SRC_APK" ]; then
            echo "No APK found in $APK_DIR"
            exit 1
          fi
          DEST_APK="$APK_DIR/vinor-${{ steps.version.outputs.VERSION }}.apk"
          mv "$SRC_APK" "$DEST_APK"
          echo "Renamed to: $DEST_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinor-direct-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # فایل .aab با باز کردن در گوشی نصب نمی‌شود و خطای «مشکلی در تجزیه بسته» می‌دهد؛ فقط APK را برای سایدلود استفاده کنید.
      - name: Sideload hint (APK vs AAB)
        run: |
          {
            echo "## Android sideload — APK vs AAB"
            echo ""
            echo "| Artifact | Install by opening on phone? |"
            echo "|----------|--------------------------------|"
            echo "| **vinor-direct-apk** (\`.apk\`) | Yes — use this for direct install |"
            echo "| **vinor-play-bundle-not-for-phone** (\`.aab\`) | **No** — Play Console only; opening it on device often shows *Problem parsing the package* |"
            echo ""
            echo "### فارسی"
            echo "برای نصب دستی، حتماً آرتیفکت **vinor-direct-apk** (پسوند **apk**) را بگیرید. فایل **aab** شبیه اپ نیست و قابل نصب مستقیم روی گوشی نیست."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: (Optional) Rename AAB to include version
        continue-on-error: true
        shell: bash
        run: |
          AAB_DIR="app/build/outputs/bundle/release"
          if ls "$AAB_DIR"/*.aab >/dev/null 2>&1; then
            SRC_AAB="$(ls -1 "$AAB_DIR"/*.aab | head -n 1)"
            DEST_AAB="$AAB_DIR/vinor-${{ steps.version.outputs.VERSION }}.aab"
            mv "$SRC_AAB" "$DEST_AAB"
            echo "Renamed AAB to: $DEST_AAB"
          else
            echo "No AAB found; skipping rename."
          fi

      - name: (Optional) Upload AAB artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vinor-play-bundle-not-for-phone
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14


